  <circle cx="180" cy="90" r="150" fill="#8b5cf6" fill-opacity="0.20"/>
  <circle cx="930" cy="260" r="180" fill="#22d3ee" fill-opacity="0.14"/>
  <text x="560" y="176" text-anchor="middle" font-family="Segoe UI, sans-serif"
