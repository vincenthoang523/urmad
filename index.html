<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>e-bio</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@300;400&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <canvas id="embers"></canvas>
  <div class="vignette"></div>
  <div class="scanlines"></div>

  <!-- Enter gate -->
  <div id="gate">
    <div class="gate-inner">
      <div class="gate-title">click to enter</div>
    </div>
  </div>

  <main id="stage">
    <section class="card">
      <div class="card-glow"></div>

      <div class="pfp-wrap">
        <div class="pfp-ring"></div>
        <img id="pfp" src="" alt="profile picture" />
      </div>

      <h1 id="username" class="username"></h1>

      <div class="divider"><span></span><i>&#10022;</i><span></span></div>

      <blockquote class="quote">
        <span class="q-mark left">&ldquo;</span>
        <span id="quote" class="quote-text"></span>
        <span class="q-mark right">&rdquo;</span>
      </blockquote>

    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
